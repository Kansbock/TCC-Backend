spring.application.name=aves

# ApiError.fieldErrors deve ser omitido (não null) quando não houver erro de campo.
spring.jackson.default-property-inclusion=non_null

# JWT
# jwt.secret MUST be provided via environment variable (JWT_SECRET) or another
# externalized source (e.g. AWS Secrets Manager, Parameter Store). There is no
# default here on purpose: the application must fail fast at startup instead of
# running with a weak, publicly-known secret.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# AWS / DynamoDB
# Region and table names are required. Credentials are never configured here:
# the AWS SDK default credentials provider chain resolves them from the
# environment, shared config/credentials files, or the instance/task role.
aws.region=${AWS_REGION:us-east-1}
# Optional: only set when running against DynamoDB Local (tests/dev). Must be
# left unset in any real AWS environment.
aws.dynamodb.endpoint-override=${AWS_DYNAMODB_ENDPOINT_OVERRIDE:}

app.dynamodb.users-table=${AVES_USERS_TABLE:aves-users}
app.dynamodb.species-table=${AVES_SPECIES_TABLE:aves-species}
app.dynamodb.sightings-table=${AVES_SIGHTINGS_TABLE:aves-sightings}
app.dynamodb.sightings-timeline-index=${AVES_SIGHTINGS_TIMELINE_INDEX:timeline-index}
app.notifications.runner-user-id=${NOTIFICATION_RUNNER_USER_ID:}
app.notifications.processing-enabled=${NOTIFICATION_PROCESSING_ENABLED:false}

# Sighting pagination defaults
app.sightings.default-page-size=20
app.sightings.max-page-size=50
app.sightings.max-species-per-sighting=20
app.sightings.writes-paused=${SIGHTINGS_WRITES_PAUSED:false}
# Safety bound for how many months the query engine walks backward when no
# explicit "from" date is given (~5 years). Prevents unbounded scanning across
# time-bucketed partitions.
app.sightings.max-lookback-months=60
